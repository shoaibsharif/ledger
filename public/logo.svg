<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100" height="100" fill="#f5f0e8" />
  <!-- Heavy structural L shape -->
  <path 
    d="M20 20 V80 H80" 
    stroke="#0a0a0a" 
    stroke-width="12" 
    stroke-linecap="square"
  />
  <!-- International Orange Accent - The 'Record' or 'Spark' -->
  <rect x="50" y="50" width="30" height="30" fill="#ff4f00" />
  <!-- Stylized grid/archive lines -->
  <line x1="30" y1="40" x2="60" y2="40" stroke="#0a0a0a" stroke-width="4" />
  <line x1="30" y1="55" x2="45" y2="55" stroke="#0a0a0a" stroke-width="4" />
</svg>
